<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Casey Keown Studios | Mission Critical Web Development</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&family=Barlow+Condensed:ital,wght@0,300;0,400;0,600;0,700;1,300&family=Barlow:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cmd-black: #0A0A0A;
      --tac-green: #1F2A1F;
      --accent-green: #4ade80;
      --text-main: #E0E0E0;
      --text-muted: #888888;
      --font-mono: 'Share Tech Mono', monospace;
    }
    body {
      background-color: var(--cmd-black);
      color: var(--text-main);
      font-family: 'Barlow', sans-serif;
      overflow-x: hidden;
      /* Fixed mobile safe area padding */
      padding-top: calc(102px + env(safe-area-inset-top));
    }
    
    /* 1. Optimized Ticker */
    .top-bar {
      position: fixed;
      top: env(safe-area-inset-top);
      left: 0;
      width: 100%;
      height: 32px;
      background-color: var(--accent-green);
      color: var(--cmd-black);
      display: flex;
      align-items: center;
      overflow: hidden;
      z-index: 1001;
    }
    .ticker-inner {
      display: inline-block;
      white-space: nowrap;
      padding-left: 100%;
      animation: ticker-anim 25s linear infinite;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      will-change: transform;
      transform: translateZ(0);
      backface-visibility: hidden;
    }
    @keyframes ticker-anim {
      from { transform: translate3d(0,0,0); }
      to { transform: translate3d(-100%,0,0); }
    }

    /* 2/3. Fixed Header */
    .header {
      position: fixed !important;
      top: calc(32px + env(safe-area-inset-top)) !important;
      left: 0;
      width: 100%;
      height: 70px !important;
      min-height: 70px;
      max-height: 70px;
      background-color: var(--cmd-black) !important;
      border-bottom: 1px solid var(--accent-green) !important;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1.5rem !important;
      z-index: 1000;
      flex-shrink: 0;
    }
    .logo-icon { width: 26px; height: 26px; }
    .logo-container { font-size: 1.35rem; font-family: 'Bebas Neue'; color: var(--accent-green); }

    /* 7. Operator Headshot */
    .operator-img {
      width: 150px; height: 150px; border-radius: 50%; object-fit: cover;
      opacity: 0.5; border: 2px solid var(--accent-green); margin-bottom: 1rem;
      transition: opacity 0.3s ease;
    }
    .operator-img:hover { opacity: 0.7; }

    /* Other styles (Hero, Capabilities, etc.) remain as defined in original file... */
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="ticker-inner">
      SYSTEM STATUS: OPERATIONAL &bull; MISSION: BUILD HIGH PERFORMANCE CUSTOM WEB ARCHITECTURE &bull; CASEY KEOWN STUDIOS
    </div>
  </div>
  <header class="header">
    <div class="logo-container">CK STUDIOS</div>
    <nav class="nav-links">...</nav>
  </header>
  <!-- Main Content Body -->
  <script>
    // 6. Mobile-safe intervals
    const pingInterval = window.setInterval(() => { /* logic */ }, 200);
    
    // 8. Enhanced mobile scroll triggers
    function handleMobileScrollIntersection() { /* Trigger logic */ }
    window.addEventListener('load', handleMobileScrollIntersection);
    window.addEventListener('touchmove', handleMobileScrollIntersection, { passive: true });
  </script>
</body>
</html>
