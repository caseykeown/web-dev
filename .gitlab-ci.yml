pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir -p public
    - cp -r assets blog css scripts public/ 2>/dev/null || true
    - cp *.html *.xml *.txt _headers _redirects public/ 2>/dev/null || true
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
