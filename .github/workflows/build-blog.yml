name: Build blog

on:
  push:
    branches: [main]
    paths:
      - "blog/**.md"
      - "blog/**.markdown"
      - "blog/**.doc"
      - "blog/**.docx"
      - "scripts/build_blog.py"
      - "scripts/build_blog_index.py"
      - ".github/workflows/build-blog.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Preserve branded blog index
        run: cp blog/index.html "$RUNNER_TEMP/blog-index-template.html"

      - name: Ensure homepage blog markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("index.html")
          homepage = path.read_text(encoding="utf-8")
          start = "<!-- BLOG_POSTS_START -->"
          end = "<!-- BLOG_POSTS_END -->"

          if homepage.count(start) == 1 and homepage.count(end) == 1:
              print("Homepage blog markers already present.")
          elif start in homepage or end in homepage:
              raise RuntimeError("Homepage contains an incomplete blog marker pair.")
          else:
              pattern = r'(?P<block><div class="card-grid" id="latest-posts">.*?\n        </div>)'
              replacement = start + "\n" + r'\g<block>' + "\n" + end
              homepage, count = re.subn(pattern, replacement, homepage, count=1, flags=re.DOTALL)
              if count != 1:
                  raise RuntimeError("Could not find the homepage latest-posts card grid.")
              path.write_text(homepage, encoding="utf-8")
              print("Added homepage blog markers.")
          PY

      - name: Build blog
        run: |
          python3 scripts/build_blog.py
          python3 scripts/build_blog_index.py "$RUNNER_TEMP/blog-index-template.html"

      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html blog/index.html blog/feed.xml blog/articles sitemap.xml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Rebuild blog [skip ci]"
            git push
          fi
