name: Build blog

on:
  push:
    branches: [main]
    paths:
      - "blog/**.md"
      - "blog/**.markdown"
      - "blog/**.doc"
      - "blog/**.docx"
      - "scripts/build_blog.py"
      - ".github/workflows/build-blog.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build blog
        run: python3 scripts/build_blog.py

      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html blog/index.html blog/feed.xml blog/articles sitemap.xml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Rebuild blog [skip ci]"
            git push
          fi
