name: Optimize site assets

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply_performance_fixes.py"
      - ".github/workflows/optimize-site-assets.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply performance fixes
        run: python3 scripts/apply_performance_fixes.py

      - name: Validate changed references
        run: |
          test "$(wc -c < assets/favicon.svg)" -lt 2048
          test "$(wc -c < assets/cwa-horizontal-black.svg)" -lt 4096
          ! grep -R 'assets/headshot.jpg' index.html about.html
          grep -q 'headshot-640.webp' index.html
          grep -q 'headshot-960.webp' about.html

      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _headers index.html about.html assets/favicon.svg assets/cwa-horizontal-black.svg scripts/build_blog.py scripts/build_blog_index.py blog '*.html'
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Optimize shared site assets [skip ci]"
            git push
          fi
